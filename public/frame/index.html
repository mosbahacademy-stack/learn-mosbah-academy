<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a7a3b">
<title>قالب الصور - جبهة المستقبل متليلي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
  @font-face { font-family:'Camel'; src:url('fonts/TheYearofTheCamel-Medium.otf') format('opentype'); font-weight:500; font-display:swap; }
  @font-face { font-family:'Camel'; src:url('fonts/TheYearofTheCamel-Bold.otf') format('opentype'); font-weight:700; font-display:swap; }
  :root { --green:#0a7a3b; --bg:#0d1512; --card:#16211c; --text:#eef5f0; --muted:#9db3a6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Camel',system-ui,sans-serif; min-height:100vh; }
  header { padding:16px; text-align:center; background:linear-gradient(0deg,transparent,rgba(10,122,59,.35)); }
  header h1 { margin:0; font-size:20px; font-weight:700; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  main { max-width:640px; margin:0 auto; padding:0 16px 32px; }
  .preview { background:var(--card); border-radius:16px; min-height:260px; display:flex; align-items:center; justify-content:center; overflow:hidden; margin:12px 0; }
  .preview canvas { width:100%; height:auto; display:block; }
  .preview .empty { color:var(--muted); text-align:center; padding:24px; }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button, label.btn { font:inherit; font-weight:700; font-size:16px; border:0; border-radius:12px; padding:14px; cursor:pointer; text-align:center; color:#fff; background:var(--green); }
  .secondary { background:#2a3a32 !important; }
  .full { grid-column:1 / -1; }
  button:disabled { opacity:.45; }
  input[type=file] { display:none; }
  .opts { background:var(--card); border-radius:12px; padding:12px 14px; margin-top:12px; font-size:14px; }
  .opts label { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; }
  .opts input[type=range] { width:55%; accent-color:var(--green); }
  .status { text-align:center; color:var(--muted); font-size:13px; min-height:20px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>قالب الصور — جبهة المستقبل</h1>
  <p>المكتب البلدي لمتليلي الشعانبة · القائمة رقم 3</p>
</header>
<main>
  <div class="preview" id="preview"><div class="empty">اختر صورة أو التقط صورة جديدة<br>وسيتم تصحيحها وإضافة القالب تلقائياً</div></div>

  <div class="btns">
    <label class="btn">📁 اختيار صور<input id="pick" type="file" accept="image/*" multiple></label>
    <label class="btn">📷 الكاميرا<input id="cam" type="file" accept="image/*" capture="environment"></label>
    <button id="save" disabled>⬇️ حفظ</button>
    <button id="share" disabled>📤 مشاركة</button>
    <label class="btn secondary full">🟢 تغيير شعار الحزب<input id="logoPick" type="file" accept="image/*"></label>
  </div>

  <div class="opts">
    <label><span><input type="checkbox" id="autoFix" checked> تصحيح الألوان والإضاءة تلقائياً</span></label>
    <label>ارتفاع التدرج الأخضر <input type="range" id="gradH" min="15" max="50" value="30"></label>
    <label>الهاشتاغ <input type="text" id="hashtag" dir="rtl" style="width:60%;font:inherit;padding:6px 8px;border-radius:8px;border:1px solid #2a3a32;background:#0d1512;color:#eef5f0"></label>
    <label>قوة اللون الأخضر <input type="range" id="gradA" min="20" max="100" value="75"></label>
  </div>
  <div class="status" id="status"></div>
</main>
<script src="app.js"></script>
</body>
</html>
